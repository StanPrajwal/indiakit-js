<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>indiakit-js demo</title>
    <meta name="description" content="Live demo of indiakit-js: GSTIN, PAN, IFSC, UPI, PIN code, mobile and ₹ validators, formatters and headless React hooks for Indian apps." />
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1917; background: #fafaf9; }
      body { margin: 0; }
      main { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      .sub { color: #57534e; margin: 0 0 12px; }
      .links { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 32px; font-size: 14px; }
      .links a { color: #2563eb; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; }
      section { background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 20px; }
      h2 { font-size: 15px; margin: 0 0 12px; }
      label { display: block; font-size: 13px; color: #57534e; margin: 10px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 15px; border: 1px solid #d6d3d1; border-radius: 8px; font-family: ui-monospace, monospace; }
      input:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
      input[data-valid] { border-color: #16a34a; }
      input[data-invalid] { border-color: #dc2626; }
      .err { color: #dc2626; font-size: 13px; margin-top: 6px; min-height: 18px; }
      .ok { color: #15803d; font-size: 13px; margin-top: 6px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 10px 0 0; }
      dt { color: #78716c; } dd { margin: 0; }
      code { font-size: 12px; word-break: break-all; background: #f5f5f4; padding: 2px 4px; border-radius: 4px; }
      .qr { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
      .big { font-size: 22px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
